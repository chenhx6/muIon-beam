<!doctype html><meta charset="utf-8"><title>Research State Dashboard</title><style>body{font:15px system-ui;max-width:1000px;margin:2rem auto;padding:0 1rem;background:#f6f7f9}section{background:white;padding:1rem;margin:1rem 0;border-radius:8px}h1{margin-bottom:.2rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}pre{white-space:pre-wrap}</style><h1>Research workflow</h1><p id="updated"></p><div class="grid"><section><b>Current</b><pre id="current"></pre></section><section><b>Next action</b><pre id="next"></pre></section><section><b>Progress</b><pre id="progress"></pre></section></div><section><b>Completed / Pending / Blocked</b><pre id="stages"></pre></section><section><b>Goal / Checkpoint / Continuation</b><pre id="continuation"></pre></section><section><b>Convergence / Health</b><pre id="health"></pre></section><section><b>Open Problems</b><pre id="problems"></pre></section><section><b>Agents</b><pre id="agents"></pre></section><section><b>Warnings</b><pre id="warnings"></pre></section><script>async function refresh(){const d=await fetch('/api/status').then(r=>r.json());updated.textContent='Last update: '+(d.display.last_update||'unknown');current.textContent=JSON.stringify(d.display.current,null,2);next.textContent=d.display.next_action||'none';progress.textContent=JSON.stringify(d.display.progress);stages.textContent=JSON.stringify({completed:d.display.completed,pending:d.display.pending,blocked:d.display.blocked},null,2);continuation.textContent=JSON.stringify({goal:d.display.goal,checkpoint:d.display.checkpoint,continuation:d.display.continuation},null,2);health.textContent=JSON.stringify({convergence:d.display.convergence,health:d.display.health},null,2);problems.textContent=JSON.stringify(d.display.open_problems,null,2);agents.textContent=JSON.stringify(d.agents,null,2);warnings.textContent=d.warnings.length?d.warnings.join('\n'):'none'}refresh();setInterval(refresh,3000)</script>
