<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>muIon-beam · 工作看板</title>
  <style>
    :root { color-scheme:dark; --bg:#0b1220; --panel:#111b2e; --card:#17243b; --line:#263653; --text:#e7edf7; --muted:#91a1ba; --blue:#6ea8fe; --green:#54d39a; --amber:#f2c66d; --red:#f38b8b; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; background:radial-gradient(circle at 15% 0%,#172b4b 0,var(--bg) 42rem); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    .shell { width:min(1040px,calc(100% - 32px)); margin:0 auto; padding:18px 0 32px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:13px 16px; border:1px solid var(--line); border-radius:14px; background:var(--panel); }
    .brand,.services,.service { display:flex; align-items:center; gap:9px; }
    .brand { font-weight:750; }
    .logo { display:grid; place-items:center; width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,#6ea8fe,#9a7bff); color:#08101e; font-weight:900; }
    .service { color:var(--muted); font-size:12px; }
    .service[hidden] { display:none; }
    .services { gap:14px; flex-wrap:wrap; justify-content:flex-end; }
    .dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
    .ok { color:var(--green); } .warn { color:var(--amber); } .bad { color:var(--red); }
    main { padding-top:26px; }
    .intro { display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:18px; }
    h1 { margin:0; font-size:clamp(25px,4vw,34px); line-height:1.15; }
    .subtitle { margin:7px 0 0; color:var(--muted); font-size:13px; }
    .updated { color:var(--muted); font-size:12px; white-space:nowrap; }
    .counts { display:flex; gap:9px; flex-wrap:wrap; margin-bottom:14px; }
    .count { border:1px solid var(--line); border-radius:999px; padding:5px 11px; background:rgb(17 27 46 / 88%); color:var(--muted); font-size:12px; }
    .count strong { margin-left:5px; color:var(--text); font-size:14px; }
    .groups { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:start; gap:14px; }
    .group { min-width:0; padding:16px; border:1px solid var(--line); border-radius:16px; background:rgb(17 27 46 / 94%); }
    .group-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    h2 { margin:0; font-size:17px; }
    .session-list { display:grid; gap:9px; }
    .session { min-width:0; padding:13px; border:1px solid var(--line); border-radius:12px; background:var(--card); }
    .session-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .session-name { min-width:0; font-size:15px; font-weight:720; overflow-wrap:anywhere; }
    .badge { flex:none; border:1px solid currentColor; border-radius:999px; padding:2px 8px; font-size:11px; white-space:nowrap; }
    .session-meta { margin-top:7px; color:var(--muted); font-size:12px; }
    .session-next { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:12px; }
    .session-next span { color:var(--muted); }
    a { color:var(--blue); font-weight:650; text-decoration:none; white-space:nowrap; }
    a:hover { text-decoration:underline; }
    .empty { padding:22px 10px; border:1px dashed var(--line); border-radius:11px; color:var(--muted); font-size:13px; text-align:center; }
    footer { margin-top:18px; color:var(--muted); font-size:11px; text-align:center; }
    @media(max-width:700px) { .shell { width:min(100% - 20px,1040px); padding-top:10px; } header,.intro { align-items:flex-start; flex-direction:column; } .services { justify-content:flex-start; } .groups { grid-template-columns:1fr; } .updated { white-space:normal; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><span class="logo">μ</span><span>muIon-beam · 工作看板</span><span id="connection" class="service warn" hidden><i class="dot"></i>连接中</span></div>
      <div id="services" class="services"></div>
    </header>
    <main>
      <section class="intro"><div><h1>Session 工作状态</h1><p class="subtitle">正在进行的任务，以及中断后需要继续的任务。</p></div><div id="updated" class="updated">读取状态中…</div></section>
      <div class="counts" aria-label="session 数量"><span class="count">正在工作<strong id="active-count">0</strong></span><span class="count">需要处理<strong id="pending-count">0</strong></span></div>
      <div class="groups">
        <section class="group" aria-labelledby="active-title"><div class="group-head"><h2 id="active-title">正在工作</h2></div><div id="active-list" class="session-list"><div class="empty">正在读取…</div></div></section>
        <section class="group" aria-labelledby="pending-title"><div class="group-head"><h2 id="pending-title">中断或待处理</h2></div><div id="pending-list" class="session-list"><div class="empty">正在读取…</div></div></section>
      </div>
    </main>
    <footer>自动刷新 · 只读状态看板</footer>
  </div>
  <script src="/supervision.js"></script>
</body>
</html>
